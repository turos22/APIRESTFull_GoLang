name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Vet, build e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race -timeout 10m

  imagens:
    name: Build das imagens
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build dos tres stages
        run: |
          docker build --target api     -t ecom-api:ci     .
          docker build --target worker  -t ecom-worker:ci  .
          docker build --target migrate -t ecom-migrate:ci .
