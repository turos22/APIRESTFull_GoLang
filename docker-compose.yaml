services:
  postgres:
    image: postgres:17-alpine
    container_name: api_ecom_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_ecom
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "api_ecom"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: api_ecom_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Vida curta: aplica as migrations e morre com exit 0.
  # A api e o worker esperam esse exit 0 para subir.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://postgres:postgres@postgres:5432/api_ecom?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    ports:
      - "8080:8080"
    # Dentro da rede do compose o host e o NOME DO SERVICO e a porta e a
    # interna: postgres:5432, nao localhost:5434.
    environment:
      GOOSE_DBSTRING: postgres://postgres:postgres@postgres:5432/api_ecom?sslmode=disable
      GOOSE_REDIS: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Nao tem ports: ninguem conecta nele. Ele consome do Redis.
  worker:
    build:
      context: .
      target: worker
    environment:
      GOOSE_DBSTRING: postgres://postgres:postgres@postgres:5432/api_ecom?sslmode=disable
      GOOSE_REDIS: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
